spring.application.name=cooperanki
# Configuración de Conexión a la Base de Datos
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true
spring.jpa.properties.hibernate.type.json_format_mapper=org.hibernate.type.format.jackson.Jackson3JsonFormatMapper

# Configuración de Flyway Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Configuración JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Almacenamiento S3 de documentos de proyectos
app.storage.s3.region=${AWS_REGION:us-east-1}
app.storage.s3.bucket=${S3_BUCKET:}
app.storage.s3.endpoint=${S3_ENDPOINT:}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB

# Generación de embeddings y cálculo programado de recomendaciones
app.matching.worker.url=${MATCHING_WORKER_URL:http://localhost:8000}
app.matching.worker.api-key=${MATCHING_WORKER_API_KEY:}
app.matching.worker.timeout-ms=${MATCHING_WORKER_TIMEOUT_MS:600000}
app.matching.scheduler.enabled=${MATCHING_SCHEDULER_ENABLED:true}
app.matching.scheduler.fixed-delay-ms=${MATCHING_SCHEDULER_FIXED_DELAY_MS:3600000}
app.matching.scheduler.initial-delay-ms=${MATCHING_SCHEDULER_INITIAL_DELAY_MS:60000}
app.matching.max-recommendations-per-project=${MATCHING_MAX_RECOMMENDATIONS_PER_PROJECT:50}

# Niveles de Logging
logging.level.root=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE